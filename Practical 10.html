<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white text-center p-6">
        <h1 class="text-3xl font-bold">Student Expense Tracker</h1>
        <p class="mt-2">Manage your daily expenses easily</p>
    </header>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-5">

        <!-- Add Expense -->
        <div class="bg-white p-6 rounded-lg shadow mb-6">

            <h2 class="text-xl font-bold mb-4">
                Add New Expense
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    class="border p-3 rounded"
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount"
                    class="border p-3 rounded"
                >

                <select id="expenseCategory"
                        class="border p-3 rounded">

                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Study">Study</option>
                    <option value="Other">Other</option>

                </select>

            </div>

            <button
                onclick="addExpense()"
                class="bg-blue-600 text-white px-6 py-3 rounded mt-4
                       hover:bg-blue-700">

                Add Expense

            </button>

        </div>

        <!-- Total Expense -->
        <div class="bg-white p-6 rounded-lg shadow mb-6 text-center">

            <h2 class="text-lg font-semibold">
                Total Expense
            </h2>

            <p id="total"
               class="text-3xl font-bold text-blue-600 mt-2">
                ₹0
            </p>

        </div>

        <!-- Expense List -->
        <div class="bg-white p-6 rounded-lg shadow">

            <h2 class="text-xl font-bold mb-4">
                Expense List
            </h2>

            <div id="expenseList">
                <p class="text-gray-500 text-center">
                    No expenses added yet.
                </p>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script>

        let expenses = [];
        let totalAmount = 0;

        function addExpense() {

            let name = document.getElementById("expenseName").value;
            let amount = Number(
                document.getElementById("expenseAmount").value
            );
            let category = document.getElementById("expenseCategory").value;

            // Validation
            if (name === "" || amount <= 0) {
                alert("Please enter valid expense details.");
                return;
            }

            // Create expense object
            let expense = {
                name: name,
                amount: amount,
                category: category
            };

            expenses.push(expense);

            totalAmount = totalAmount + amount;

            displayExpenses();

            // Clear input fields
            document.getElementById("expenseName").value = "";
            document.getElementById("expenseAmount").value = "";
        }


        function displayExpenses() {

            let list = document.getElementById("expenseList");

            list.innerHTML = "";

            expenses.forEach(function(expense, index) {

                let div = document.createElement("div");

                div.className =
                    "flex flex-col md:flex-row md:items-center " +
                    "justify-between bg-gray-100 p-4 rounded mb-3 gap-2";

                div.innerHTML = `
                    <div>
                        <h3 class="font-bold">${expense.name}</h3>

                        <p class="text-gray-600">
                            Category: ${expense.category}
                        </p>
                    </div>

                    <div class="flex items-center gap-3">

                        <span class="font-bold text-blue-600">
                            ₹${expense.amount}
                        </span>

                        <button
                            onclick="deleteExpense(${index})"
                            class="bg-red-500 text-white px-3 py-2 rounded">

                            Delete

                        </button>

                    </div>
                `;

                list.appendChild(div);
            });

            document.getElementById("total").innerHTML =
                "₹" + totalAmount;
        }


        function deleteExpense(index) {

            totalAmount =
                totalAmount - expenses[index].amount;

            expenses.splice(index, 1);

            displayExpenses();
        }

    </script>

</body>
</html>
