<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-600 text-white text-center p-5">
        <h1 class="text-3xl font-bold">Product Showcase</h1>
        <p class="mt-2">Explore Our Latest Products</p>
    </header>

    <!-- Product Section -->
    <section class="p-6">

        <div class="flex flex-col md:flex-row gap-6 justify-center items-center">

            <!-- Product 1 -->
            <div class="bg-white rounded-lg shadow-lg p-5 w-full md:w-1/3 text-center">
                <img src="https://via.placeholder.com/250"
                     class="mx-auto rounded-lg">

                <h2 class="text-xl font-bold mt-4">Smart Watch</h2>
                <p class="text-gray-600 mt-2">
                    Stylish smartwatch with modern features.
                </p>

                <p class="text-blue-600 font-bold text-lg mt-3">
                    ₹1999
                </p>

                <button class="bg-blue-600 text-white px-5 py-2 rounded mt-4
                               hover:bg-blue-700">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white rounded-lg shadow-lg p-5 w-full md:w-1/3 text-center">
                <img src="https://via.placeholder.com/250"
                     class="mx-auto rounded-lg">

                <h2 class="text-xl font-bold mt-4">Wireless Headphones</h2>
                <p class="text-gray-600 mt-2">
                    Enjoy high-quality sound without wires.
                </p>

                <p class="text-blue-600 font-bold text-lg mt-3">
                    ₹1499
                </p>

                <button class="bg-blue-600 text-white px-5 py-2 rounded mt-4
                               hover:bg-blue-700">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white rounded-lg shadow-lg p-5 w-full md:w-1/3 text-center">
                <img src="https://via.placeholder.com/250"
                     class="mx-auto rounded-lg">

                <h2 class="text-xl font-bold mt-4">Laptop</h2>
                <p class="text-gray-600 mt-2">
                    Powerful laptop for study and work.
                </p>

                <p class="text-blue-600 font-bold text-lg mt-3">
                    ₹49999
                </p>

                <button class="bg-blue-600 text-white px-5 py-2 rounded mt-4
                               hover:bg-blue-700">
                    Buy Now
                </button>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-4 mt-6">
        © 2026 Product Showcase
    </footer>

</body>
</html>
